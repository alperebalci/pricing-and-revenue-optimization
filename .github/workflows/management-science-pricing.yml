name: Management Science Pricing Extensions

# Required baseline runs on each main commit and every pull request.
# Path-scoped workflows may remain as additional specialized checks.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project:
          - causal-operations-and-experimentation
          - empirical-operations-and-demand-modeling
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r projects/${{ matrix.project }}/requirements.txt
      - run: PYTHONPATH=projects/${{ matrix.project }} pytest -q projects/${{ matrix.project }}
